# =============================================================
# docker-compose para entrenar finalModel.py (ConvNeXt) con GPU.
#
# Uso:
#   DATASET_DIR=/ruta/a/tu/dataset OUTPUT_DIR=/ruta/a/outputs \
#     docker compose up --build
#
# DATASET_DIR debe tener la estructura:
#   train/<label>/*.jpg   val/<label>/*.jpg   test/<label>/*.jpg
# =============================================================
services:
  convnext-train:
    build: .
    image: muumetrics-convnext:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${DATASET_DIR:-./dataset}:/data
      - ${OUTPUT_DIR:-./outputs}:/outputs
    command:
      - "--data_dir"
      - "/data"
      - "--output_dir"
      - "/outputs"
      - "--model"
      - "convnext_base"
      - "--epochs"
      - "40"

  # Variante con FiLM sobre días en leche (filmModel.py).
  # Uso:
  #   IMAGES_DIR=/ruta/Dataset/Images DEL_CSV=/ruta/dataset_del.csv \
  #   OUTPUT_DIR=/ruta/outputs_film FOLD=0 docker compose run --rm convnext-film
  # Para baseline (--no_film) o varios folds usa run_film_cv.sh.
  convnext-film:
    build: .
    image: muumetrics-convnext:latest
    shm_size: 2gb
    entrypoint: ["python", "filmModel.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${IMAGES_DIR:-../../../Dataset/Images}:/data/images:ro
      - ${DEL_CSV:-../../../dataset_del.csv}:/data/dataset_del.csv:ro
      - ${OUTPUT_DIR:-./outputs_film}:/outputs
    command:
      - "--csv"
      - "/data/dataset_del.csv"
      - "--images_dir"
      - "/data/images"
      - "--output_dir"
      - "/outputs/fold${FOLD:-0}"
      - "--fold"
      - "${FOLD:-0}"
